[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blurdetector"
version = "0.1.0"
description = "Local photo triage and organizer: blur/focus rejection, blink detection, burst grouping, hierarchical organization."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Bibhash Chandra Mitra" }]
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.2",
    "pillow-heif>=0.16",
    "rawpy>=0.21",
    "mediapipe>=0.10.14",
    "imagehash>=4.3",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "onnxruntime>=1.24.3",
    "insightface>=0.7.3",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "coremltools>=9.0",
    "h5py>=3.16.0",
    "certifi>=2024.2.2",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
blurdetector = "blurdetector.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["blurdetector"]

[tool.ruff]
line-length = 100
target-version = "py310"
